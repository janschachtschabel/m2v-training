[project]
name = "m2vtrain"
version = "0.2.0"
description = "Train and evaluate German education Model2Vec (static embedding) models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "model2vec[distill,train,quantization]==0.10.0",
    "sentence-transformers>=5.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "simplemma>=2.0,<3",
    "streamlit>=1.40",
    "huggingface_hub>=1.0",
    "pyarrow>=14",
]

[project.scripts]
m2vtrain = "m2vtrain.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["m2vtrain*"]

[tool.setuptools.package-data]
m2vtrain = ["resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
